apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartpm-ai
  labels:
    app: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
    spec:
      containers:
      - name: ai
        image: smartpm-ai:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: GEMINI_API_KEY
          value: "votre_cle_api_ici"
        - name: MONGODB_URI
          value: "mongodb://smartpm-mongo:27017/smartpm"
---
apiVersion: v1
kind: Service
metadata:
  name: smartpm-ai
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: ai
