server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── FastAPI AI Service (smartpm-ai:8000) ──────────────────────
    # /chat, /simulate, /plan, /risk, /status → FastAPI
    location ~ ^/(chat|simulate|plan|risk)(/|$) {
        proxy_pass http://smartpm-ai:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        # Required for streaming responses (SSE / chunked)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location /ai-status {
        proxy_pass http://smartpm-ai:8000/status;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # ── NestJS Backend (smartpm-backend:3000) ─────────────────────
    # All other API routes → NestJS
    location ~ ^/(auth|users|projects|tasks|notifications|comments|training|admin|ai|metrics)(/|$) {
        proxy_pass http://smartpm-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── Angular SPA ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
