<div class="manager-dashboard">
  <!-- Clean Corporate Header -->
  <header class="clean-header">
    <div class="title-group">
      <h1>Project Management Dashboard</h1>
      <span class="subtitle">Overview & Progress Tracking</span>
    </div>
    <div class="action-group">
      <button class="btn btn-primary" (click)="launchWizard()">
        + Create New Project
      </button>
    </div>
  </header>

  <!-- High-level stats -->
  <section class="stats-grid mt-4">
    <div class="stat-card" *ngFor="let stat of stats">
      <div class="stat-icon">{{ stat.icon }}</div>
      <div class="stat-details">
        <h3>{{ stat.value }}</h3>
        <p>{{ stat.label }}</p>
      </div>
    </div>
  </section>

  <!-- Detailed Progress Tracking Section -->
  <section class="tracking-section mt-4">
    <div class="neo-card full-width">
      <div class="card-header">
        <h2>Active Project: {{ currentProject.name }}</h2>
        <span class="badge border-green">In Progress</span>
      </div>
      
      <!-- Overall Project Progress -->
      <div class="main-progress mt-3">
        <label>Total Completion ({{ currentProject.progress }}%)</label>
        <div class="progress-bar-container large">
          <div class="progress-fill" [style.width]="currentProject.progress + '%'"></div>
        </div>
      </div>

      <div class="activities-grid mt-4">
        <!-- Display Phase Progress -->
        <div class="activity-card" *ngFor="let act of currentProject.activities">
          <div class="act-header">
            <h4>{{ act.name }}</h4>
            <span class="percent">{{ act.progress }}%</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-fill" [style.width]="act.progress + '%'"></div>
          </div>
          
          <!-- Sub-Tasks breakdown -->
          <ul class="sub-tasks mt-3">
            <li *ngFor="let sub of act.tasks" class="sub-task">
              <span>{{ sub.name }}</span>
              <span class="status-badge" [ngClass]="sub.status">{{ sub.status }}</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>
</div>
